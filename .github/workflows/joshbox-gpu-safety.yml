name: JoshBox GPU controls and workflow safety
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'app/api/**'
      - 'vast/**'
      - 'public/**'
      - 'tests/**'
      - '.github/workflows/joshbox-gpu-safety.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node provider and GPU lifecycle tests
        run: node --experimental-strip-types --test tests/video-provider.test.mjs tests/instance-controls.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python wrapper dependencies
        run: python -m pip install -r vast/requirements.lock
      - name: Python workflow and proxy regression tests
        run: python -m unittest discover -s vast -p 'test_*.py' -v
      - name: Static browser JavaScript syntax
        run: node --check public/studio-client.js
