name: Refresh native Vercel dependency lock
on:
  push:
    branches:
      - feature/vercel-native-next
    paths:
      - .github/workflows/vercel-refresh-lock.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'joshstebs/joshbox' && github.ref == 'refs/heads/feature/vercel-native-next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install reviewed package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Regenerate lockfile without updating dependencies
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile on isolated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(vercel): pin native Next runtime dependencies"
            git push origin HEAD:feature/vercel-native-next
          fi
